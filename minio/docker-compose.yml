version: '3.7'

services:
  minio1:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio1
    command: server --console-address ":9001" /data
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /data/minio:/data
    networks:
      - bigdata
    restart: always

networks:
  bigdata:
    external: true
