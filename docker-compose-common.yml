x-app-common: &app-common
  restart: unless-stopped
  networks:
    - bigdata

x-healthcheck: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 15s

x-db-environment: &db-environment
  POSTGRES_DB: ${DATABASE_NAME}
  POSTGRES_USER: ${DATABASE_USER}
  POSTGRES_PASSWORD: ${DATABASE_PASSWORD}


x-storage-environment: &storage-environment
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-djud-dev}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-3MTcAfEH4ZCO9yu3ggjvO8mr}
  OBJECT_STORAGE_USE_SSL_FALSE: ${OBJECT_STORAGE_USE_SSL_FALSE:-false}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
  OBJECT_STORAGE_BUCKET_NAME: ${OBJECT_STORAGE_BUCKET_NAME:-sisdjud}
  OBJECT_STORAGE_PROD_ENDPOINT: ${OBJECT_STORAGE_PROD_ENDPOINT:-https://api.minio.ehealthdata.com.br}

name: bigdata

networks:
  bigdata:
    external: true
