name: bigdata_postgres

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    env_file:
      - .env
    restart: always
    ports:
      - "${PGADMIN_EXTERNAL_PORT:-5050}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@local.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - pgadmin-servers:/servers
    networks:
      - default
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
      test: ["CMD-SHELL", "curl --fail http://localhost/ || exit 1"]

  postgres:
    image: postgres:17.2
    container_name: postgres
    restart: always
    environment: 
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
      - bigdata
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    
volumes:
  pgadmin-data:
  pgadmin-servers:
  postgres-data:

networks:
  default:
    driver: bridge
  bigdata:
    external: true
